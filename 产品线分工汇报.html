<style>

:root {
  --dark: #0F1923; --light: #F5F7FA; --white: #FFFFFF;
  --text: #1E293B; --muted: #64748B;
  --font-display: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-body);background:var(--dark)}
.deck{width:100%;height:100%;position:relative}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transform:scale(0.96);
  transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1);
  pointer-events:none;padding:4vh 4vw;overflow-y:auto
}
.slide.active{opacity:1;transform:scale(1);pointer-events:auto;z-index:1}
.slide.dark{background:var(--dark);color:var(--white)}
.slide.light{background:var(--light);color:var(--text)}
.slide-inner{width:100%;max-width:92vw;margin:auto;display:flex;flex-direction:column;height:100%}
.slide-cover{text-align:center}
.slide-cover .tag{display:inline-block;padding:.4vw 1.5vw;border:1px solid rgba(255,255,255,.2);border-radius:2vw;font-size:1.1vw;color:#3B82F6;margin-bottom:3vh;letter-spacing:.2vw}
.slide-cover h1{font-family:var(--font-display);font-size:4vw;font-weight:900;line-height:1.2;margin-bottom:2vh;letter-spacing:.3vw}
.slide-cover .subtitle{font-size:1.6vw;color:#3B82F6;margin-bottom:4vh;letter-spacing:.1vw}
.slide-cover .meta{font-size:1.15vw;color:var(--muted);display:flex;align-items:center;gap:1vw;justify-content:center}
.sec-title h2{font-family:var(--font-display);font-size:2.3vw;font-weight:700;margin-bottom:1vh;letter-spacing:.08vw}
.sec-title .desc{font-size:1.1vw;color:var(--muted)}
.dark .sec-title .desc{color:#94A3B8}

.dept-badge{display:inline-block;padding:.2vw .7vw;border-radius:2vw;font-size:.82vw;font-weight:500;white-space:nowrap}
.st-tag{display:inline-block;padding:.1vw .4vw;border-radius:.2vw;font-size:.75vw;font-weight:500}
/* S2 总览 - 网格对齐布局 */
.sec-grid{display:flex;flex-direction:column;gap:.35vw;margin-top:1.5vh;flex:1;min-height:0}
.sec-row{display:flex;gap:.4vw}
.sec-cell{flex:1;min-width:0;border-radius:.35vw;overflow:hidden;box-shadow:0 .04vw .12vw rgba(0,0,0,.03)}
.sec-cell .schd{display:flex;flex-direction:column;align-items:center;gap:.25vw;padding:.55vw .5vw;color:#fff;text-align:center}
.sec-cell .schd .sc-pl{font-size:1.3vw;font-weight:700}
.sec-cell .schd .sc-lead{font-size:1vw;opacity:.85}
.sec-cell .schd .sc-total{font-size:.9vw;opacity:.75;margin-top:.1vw}

.scc .scc-title{font-size:.9vw;font-weight:600;color:#64748B;margin-bottom:.25vw;letter-spacing:.02vw}

.scc .scc-label{font-size:.75vw;color:#64748B}
.scc .scc-bar{display:flex;height:.5vw;border-radius:.25vw;overflow:hidden;margin:.3vw 0 .15vw}
.scc .scc-bar div{min-width:2px}
.scc .scc-st{display:flex;gap:.5vw;margin-top:.08vw}
.scc .scc-st .si{display:flex;align-items:center;gap:.15vw;font-size:.85vw;color:#64748B}
.si-dot{width:.5vw;height:.5vw;border-radius:50%}
.scc .scc-mem{font-size:1vw;line-height:1.5;color:#334155}
.scc .scc-mem .core{font-weight:700}
.scc .scc-mem .sep{color:#CBD5E1}
.scc .scc-mem .more{color:#94A3B8;font-size:.8vw}
.scc .scc-pend{font-size:1vw;line-height:1.45;color:#475569}
.scc .scc-pend .pi{display:flex;justify-content:space-between;padding:.1vw 0;border-bottom:1px solid #F1F5F9}
.scc .scc-pend .pi:last-child{border-bottom:none}
.scc .scc-pend .pi .pn{font-weight:500}
.scc .scc-pend .pi .pd{font-size:.75vw;color:#94A3B8}
.scc .scc-sec{font-size:1vw;line-height:1.5;color:#475569}
.scc .scc-sec .sep{color:#CBD5E1}
.scc .scc-sec .src{font-size:.75vw;color:#94A3B8}
.scc-empty{color:#94A3B8;font-size:.85vw;text-align:center;padding:.3vw 0}

.data-table{width:100%;border-collapse:collapse;font-size:.92vw;margin-top:1.2vh}
.data-table th{background:var(--dark);color:#fff;padding:.55vw .7vw;text-align:left;font-weight:600;font-size:.85vw;white-space:nowrap}
.data-table td{padding:.5vw .7vw;border-bottom:1px solid #E2E8F0;font-size:.85vw;vertical-align:middle}
.data-table tr:nth-child(even) td{background:rgba(0,0,0,.012)}
.data-table tr.row-secondary td{color:var(--muted)}
.data-table tr.row-pending td{color:#9ca3af;font-style:italic}
.data-table tr.row-pending td:first-child{font-style:normal}
.row-primary td:first-child{border-left:3px solid var(--plcolor, #3b82f6);padding-left:.5vw}
.row-primary .pl-name{font-weight:700}
.bk-tag.bk-core{background:#fef3c7;color:#92400e}

.spt{height:.35vw;background:#F1F5F9;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0}

.matrix-wrap{overflow:visible;margin-top:1vh;flex:1;min-height:0}
.matrix-table{width:100%;border-collapse:collapse;font-size:.78vw}
.matrix-table th{background:var(--dark);color:#fff;padding:.35vw .4vw;text-align:center;font-weight:600;font-size:.7vw;white-space:nowrap;position:sticky;top:0}

.matrix-table td.cell-name{text-align:left;font-weight:500}
.matrix-table th:first-child,.matrix-table td:first-child{position:sticky;left:0;background:var(--light);z-index:1;font-weight:600}
.matrix-table tr:hover td{background:rgba(59,130,246,.03)}
.matrix-table tr.row-pending td{color:#9ca3af}

.end-slide{text-align:center}
.end-slide h2{font-family:var(--font-display);font-size:2.5vw;font-weight:700;color:#3B82F6;margin-bottom:2vh}
.end-slide p{font-size:1.2vw;color:var(--muted)}

.nav{position:fixed;bottom:2.5vh;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.6vw;z-index:100}
.nav-btn{width:2.5vw;height:2.5vw;min-width:32px;min-height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2vw;transition:all .2s;backdrop-filter:blur(10px)}
.dot{width:.55vw;height:.55vw;min-width:6px;min-height:6px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
.dot.active{background:#3B82F6;width:1.6vw;min-width:16px;border-radius:1vw}
.slide-num{font-size:1vw;color:rgba(255,255,255,.5);margin:0 .6vw;min-width:3vw;text-align:center}

.legend-row{display:flex;gap:1.5vw;margin-top:.8vh;font-size:.8vw;color:var(--muted)}

/* === 左右分屏布局 === */
.lr-split{display:flex;gap:.8vw;width:100%;flex:1;min-height:0;align-items:stretch}
.lr-left{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
.lr-right{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.lr-left img,.lr-right img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:.4vw;box-shadow:0 .1vw .4vw rgba(0,0,0,.08)}
.org-chart-wrap{width:100%;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.org-chart-wrap .org-chart{padding:.25vw 0;width:100%}

.org-chart{display:flex;flex-direction:column;align-items:center;padding:.4vw .1vw .1vw}
.org-root{position:relative;margin-bottom:1.8vw;z-index:2}

.org-root::after{content:'';position:absolute;bottom:-1.8vw;left:50%;width:.15vw;height:1.8vw;background:#94a3b8;transform:translateX(-50%)}
/* 表格式网格 */
.org-tbl{table-layout:fixed;border-collapse:separate;border-spacing:0;width:100%;position:relative;padding-top:1.5vw}
.org-tbl::before{content:'';position:absolute;top:0;left:4%;right:4%;height:.12vw;background:#94a3b8}
.org-tbl-cell{border-style:solid;border-color:#E2E8F0;border-width:0 1px;background:#fff;padding:.2vw;vertical-align:top}
.org-tbl-row:first-child .org-tbl-cell{border-top-width:1px;border-radius:.35vw .35vw 0 0;position:relative}
.org-tbl-row:first-child .org-tbl-cell::before{content:'';position:absolute;top:-1.5vw;left:50%;width:.12vw;height:1.5vw;background:#94a3b8;transform:translateX(-50%)}

.org-tbl-row:first-child .org-tbl-cell:last-child{border-radius:0 .35vw 0 0}
.org-tbl-row:last-child .org-tbl-cell{border-bottom-width:1px;border-radius:0 0 .35vw .35vw}
.org-tbl-row:last-child .org-tbl-cell:first-child{border-radius:0 0 0 .35vw}
.org-tbl-row:last-child .org-tbl-cell:last-child{border-radius:0 0 .35vw 0}

.psec:first-child{margin-top:0}

.pchip{background:#fff;border:.5px solid #E2E8F0;border-radius:.3vw;padding:.15vw .35vw;font-size:.7vw;display:flex;align-items:center;gap:.2vw;line-height:1.3}

@media(max-width:768px){

}
</style>
</head>

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// === 分组 ===
var plGroups={};
ALL_PLS.forEach(function(pl){plGroups[pl]={primary:[],secondary:[],pending:[]};});
employees.forEach(function(e){
  if(e.st==='离职')return;
  if(e.st==='待入职'){if(e.pri&&plGroups[e.pri])plGroups[e.pri].pending.push(e);return;}
  if(e.pri&&plGroups[e.pri])plGroups[e.pri].primary.push(e);
  e.sec.forEach(function(s){if(plGroups[s]&&!plGroups[s].primary.find(function(x){return x.name===e.name;}))plGroups[s].secondary.push(e);});
});

function rankWeight(t){
  t=t||'';
  if(t.indexOf('董事长')>=0)return -1;
  if(t.indexOf('总经理助理')>=0)return 2;
  if(t.indexOf('总经理')>=0&&t.indexOf('总经理助理')<0)return 0;
  if(t.indexOf('副总经理')>=0||t.indexOf('副总')>=0)return 1;
  if(t.indexOf('总监')>=0)return 3;
  if(t.indexOf('项目经理')>=0)return 4;
  if(t.indexOf('开发经理')>=0)return 5;
  if(t.indexOf('经理')>=0||t.indexOf('主管')>=0)return 6;
  if(t.indexOf('架构师')>=0)return 8;
  if(t.indexOf('技术支持')>=0)return 9;
  if(t.indexOf('采购')>=0)return 10;
  if(t.indexOf('工程师')>=0)return 11;
  if(t.indexOf('助理')>=0||t.indexOf('财务')>=0)return 12;
  return 99;
}
function sortByRank(arr){return arr.slice().sort(function(a,b){return rankWeight(a.title)-rankWeight(b.title);});}
function getLead(pl){
  if(PL_LEAD_OVERRIDE[pl])
    return plGroups[pl].primary.concat(plGroups[pl].secondary).find(function(e){return e.name===PL_LEAD_OVERRIDE[pl]&&e.st==='在职';});
  var cand=plGroups[pl].primary.filter(function(e){return e.st==='在职';});
  return cand.length?sortByRank(cand)[0]:null;
}

// === 产品线维度组织结构图（Chip风格） ===
function renderOrgChart(){
  function chipB(plColor, e, isCore){
    var cls='pchip'+(e.st==='兼职'?' sec':'');
    var tag=isCore?'<span class="ptag" style="background:'+plColor+'22;color:'+plColor+'">核心</span>':'';
    return'<div class="'+cls+'"><span class="pn">'+esc(e.name)+'</span><span class="pr">'+esc(e.title)+'</span>'+tag+'</div>';
  }
  var cols=[];
  ALL_PLS.forEach(function(pl){
    var g=plGroups[pl],c=PL_COLORS[pl]||'#6b7280',bg=PL_BG[pl]||'#f9fafb';
    var a=g.primary.filter(function(e){return e.st==='在职';}).length;
    var p=g.primary.filter(function(e){return e.st==='兼职';}).length;
    var pe=g.pending.length;
    var lead=getLead(pl);
    var primaries=sortByRank(g.primary);
    var secondaries=sortByRank(g.secondary.filter(function(e){return !g.primary.find(function(x){return x.name===e.name;});}));
    cols.push({pl,c,bg,lead,a,p,pe,primaries,secondaries});
  });
  function isCore(e){return e.bk&&(e.bk.indexOf('产品线负责人')>=0||e.bk.indexOf('产品线核心成员')>=0);}
  function renderCol(d){
    var h='<div class="pcard">';
    // Lead
    if(d.lead)h+='<div class="plead" style="border-color:'+d.c+'"><div class="pln">'+esc(d.lead.name)+'<span class="plead-tag">负责</span></div><div class="plt">'+esc(d.lead.title)+'</div></div>';
    // Primary members grouped by dept
    var priOthers=d.primaries.filter(function(e){return!d.lead||e.name!==d.lead.name;});
    var rdSide=priOthers.filter(function(e){return e.dept==='研发部';});
    var dlSide=priOthers.filter(function(e){return e.dept==='交付部';});
    var otSide=priOthers.filter(function(e){return e.dept!=='研发部'&&e.dept!=='交付部';});
    if(rdSide.length){h+='<div class="psec"><div class="psl">研发侧</div><div class="pchips">';rdSide.forEach(function(e){h+=chipB(d.c,e,isCore(e));});h+='</div></div>';}
    if(dlSide.length){h+='<div class="psec"><div class="psl">交付侧</div><div class="pchips">';dlSide.forEach(function(e){h+=chipB(d.c,e,isCore(e));});h+='</div></div>';}
    if(otSide.length){h+='<div class="psec"><div class="psl">其他</div><div class="pchips">';otSide.forEach(function(e){h+=chipB(d.c,e,isCore(e));});h+='</div></div>';}
    // Cross-line
    if(d.secondaries.length){
      h+='<div class="psep"></div><div class="psec"><div class="psl">跨线协作</div><div class="pchips">';
      d.secondaries.forEach(function(e){h+='<div class="pchip sec"><span class="pn">'+esc(e.name)+'</span><span class="pr">'+(e.pri?PL_SHORT[e.pri]||e.pri:'')+'</span></div>';});
      h+='</div></div>';
    }
    // Pending
    if(d.pe){h+='<div class="psep"></div><div class="psec"><div class="psl">待招 '+d.pe+'</div><div class="pchips">';d.g=d.g||plGroups[d.pl];
      var doPend=function(){var arr=(plGroups[d.pl]&&plGroups[d.pl].pending)||[];arr.forEach(function(e){h+='<div class="pchip pend"><span class="pn">'+esc(e.name)+'</span></div>';});};doPend();
      h+='</div></div>';
    }
    return h+'</div>';
  }

  var h='<div class="org-chart"><div class="org-root"><div class="org-root-card"><div class="orn-name">赵健章</div><div class="orn-title">产品线总负责人</div></div></div>';
  h+='<table class="org-tbl"><tbody>';
  // Row 1: headers
  h+='<tr class="org-tbl-row">';
  cols.forEach(function(d){h+='<td class="org-tbl-cell"><div class="org-dept-head" style="background:'+d.bg+';color:'+d.c+'"><span>'+d.pl+'</span><span class="dept-count"><span style="color:#10b981">'+d.a+'在职</span>'+(d.p?' <span style="color:#d97706">'+d.p+'兼职</span>':'')+(d.pe?' <span style="color:#9ca3af">'+d.pe+'待招</span>':'')+'</span></div></td>';});
  h+='</tr>';
  // Row 2: content (all in one row)
  h+='<tr class="org-tbl-row">';
  cols.forEach(function(d){h+='<td class="org-tbl-cell">'+renderCol(d)+'</td>';});
  h+='</tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// === 职能维度组织结构图（Chip风格） ===
function renderFuncChart(){
  var LEADS={'总经办':'张冬晓','市场部':'马佳','研发部':'赵健章','交付部':'欧阳雄军','财务部':'祁婷'};
  var cols=[];
  FUNC_DEPT_ORDER.forEach(function(fd){
    var bg=FUNC_DEPT_BG[fd]||'#f9fafb',color=FUNC_DEPT_COLOR[fd]||'#374151';
    var all=employees.filter(function(e){return e.dept===fd&&e.st!=='待入职'&&e.name!=='赵健章'&&e.name!=='施驰';});
    if(fd==='研发部'){var z=employees.find(function(e){return e.name==='赵健章';});if(z)all.unshift(z);}
    all.sort(function(a,b){return rankWeight(a.title)-rankWeight(b.title);});
    var pends=employees.filter(function(e){return e.dept===fd&&e.st==='待入职';});
    var lead=all.find(function(e){return e.name===LEADS[fd];});
    cols.push({fd,bg,color,lead,members:all.filter(function(e){return e.name!==LEADS[fd];}),all,pends});
  });
  function chipFunc(plColor,e,isCore){
    var cls=e.st==='兼职'?'pchip sec':'pchip';
    var coreTag=isCore?'<span class="ptag" style="background:'+plColor+'22;color:'+plColor+'">核心</span>':'';
    var plTag='';
    if(e.pri)plTag='<span class="ptag" style="background:'+(PL_BG[e.pri]||'#f3f4f6')+';color:'+(PL_COLORS[e.pri]||'#374151')+'">'+(PL_SHORT[e.pri]||e.pri)+'</span>';
    return'<div class="'+cls+'"><span class="pn">'+esc(e.name)+'</span>'+coreTag+plTag+'</div>';
  }
  function renderCol(d){
    var h='<div class="pcard">';
    if(d.lead)h+='<div class="plead" style="border-color:'+d.color+';margin-bottom:.2vw"><div class="pln">'+esc(d.lead.name)+(d.lead.pri?'<span class="ptag" style="background:'+(PL_BG[d.lead.pri]||'#f3f4f6')+';color:'+(PL_COLORS[d.lead.pri]||'#374151')+'">'+(PL_SHORT[d.lead.pri]||d.lead.pri)+'</span>':'')+'</div><div class="plt">'+esc(d.lead.title)+(d.lead.st==='兼职'?' <span style="font-size:.6vw;color:#d97706">兼职</span>':'')+'</div></div>';
    if(d.members.length){
      h+='<div class="psec"><div class="psl">成员</div><div class="pchips">';
      d.members.forEach(function(e){h+=chipFunc(d.color,e,false);});h+='</div></div>';
    }
    if(d.pends.length){
      h+='<div class="psep"></div><div class="psec"><div class="psl">待招 '+d.pends.length+'</div><div class="pchips">';
      d.pends.forEach(function(e){h+='<div class="pchip pend"><span class="pn">'+esc(e.name)+'</span></div>';});h+='</div></div>';
    }
    return h+'</div>';
  }

  var h='<div class="org-chart"><div class="org-root"><div class="org-root-card"><div class="orn-name">赵健章</div><div class="orn-title">总经理</div></div></div>';
  h+='<table class="org-tbl"><tbody>';
  h+='<tr class="org-tbl-row">';
  cols.forEach(function(d){h+='<td class="org-tbl-cell"><div class="org-dept-head" style="background:'+d.bg+';color:'+d.color+'"><span>'+d.fd+'</span><span class="dept-count"><span style="color:#10b981">'+d.all.filter(function(e){return e.st==='在职';}).length+'在职</span>'+(d.all.filter(function(e){return e.st==='兼职';}).length?' <span style="color:#d97706">'+d.all.filter(function(e){return e.st==='兼职';}).length+'兼职</span>':'')+(d.pends.length?' <span style="color:#9ca3af">'+d.pends.length+'待招</span>':'')+'</span></div></td>';});
  h+='</tr>';
  h+='<tr class="org-tbl-row">';
  cols.forEach(function(d){h+='<td class="org-tbl-cell">'+renderCol(d)+'</td>';});
  h+='</tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// === S3~S7 产品线详情（表格分组） ===
function tRow(e,isPri,color,isLead,note){
  var deptClr=FUNC_DEPT_COLOR[e.dept]||'#374151',deptBg=FUNC_DEPT_BG[e.dept]||'#f3f4f6';
  var dt='<span style="display:inline-block;padding:.05vw .35vw;border-radius:.25vw;font-size:.7vw;background:'+deptBg+';color:'+deptClr+'">'+e.dept+'</span>';
  var stTag=e.st==='在职'?'<span style="display:inline-block;padding:.05vw .25vw;border-radius:.15vw;font-size:.65vw;background:#d1fae5;color:#065f46">在职</span>':'<span style="display:inline-block;padding:.05vw .25vw;border-radius:.15vw;font-size:.65vw;background:#fef3c7;color:#92400e">兼职</span>';
  var leadTag=isLead?' <span style="display:inline-block;padding:0 .2vw;border-radius:.15vw;background:'+color+';color:#fff;font-size:.6vw;font-weight:700">负责</span>':'';
  var bkHtml='—';
  if(e.bk&&e.bk.indexOf('产品线负责人')>=0)bkHtml='<span style="display:inline-block;padding:.05vw .25vw;border-radius:.15vw;font-size:.6vw;background:#dbeafe;color:#1e40af;font-weight:600">负责人</span>';
  else if(e.bk&&e.bk.indexOf('产品线核心成员')>=0)bkHtml='<span style="display:inline-block;padding:.05vw .25vw;border-radius:.15vw;font-size:.6vw;background:#ede9fe;color:#5b21b6;font-weight:600">核心</span>';
  var rowCls=isPri?'row-primary':'row-secondary';
  if(e.st==='待入职')rowCls='row-pending';
  var nameStr=esc(e.name);
  if(leadTag||(isPri&&bkHtml!=='—'&&bkHtml.indexOf('核心')>=0))nameStr='<b class="pl-name" style="'+(isPri?'color:'+color:'')+'">'+esc(e.name)+leadTag+'</b>';
  return'<tr class="'+rowCls+'" style="'+(isPri?'--plcolor:'+color:'')+'"><td>'+nameStr+'</td><td style="font-size:.75vw">'+esc(e.title)+'</td><td style="font-size:.7vw">'+bkHtml+'</td><td>'+dt+'</td><td>'+stTag+'</td><td>'+(isPri?'<span style="color:'+color+';font-weight:600">主力</span>':'<span style="color:#64748B">辅助</span>')+'</td><td style="font-size:.7vw;color:#64748B;max-width:25vw">'+esc(e.note||'')+'</td></tr>';
}
function pendRow(e){
  return'<tr class="row-pending"><td>'+esc(e.name)+'</td><td style="font-size:.75vw">'+esc(e.title)+'</td><td style="font-size:.7vw;color:#9ca3af">'+(e.bk||'')+'</td><td><span style="display:inline-block;padding:.05vw .35vw;border-radius:.25vw;font-size:.7vw;background:#f3f4f6;color:#9ca3af">'+e.dept+'</span></td><td><span style="display:inline-block;padding:.05vw .25vw;border-radius:.15vw;font-size:.65vw;background:#f3f4f6;color:#9ca3af">待招</span></td><td><span style="color:#9ca3af">待招</span></td><td style="font-size:.7vw;color:#9ca3af;max-width:25vw">'+esc(e.note||'')+'</td></tr>';
}
function tHead(){return'<thead><tr><th style="width:12%">姓名</th><th style="width:14%">职位</th><th style="width:10%">备注</th><th style="width:12%">部门</th><th style="width:8%">状态</th><th style="width:8%">归属</th><th>角色分工</th></tr></thead>';}

ALL_PLS.forEach(function(pl,pi){
  var g=plGroups[pl],color=PL_COLORS[pl],bg=PL_BG[pl];
  var lead=getLead(pl);
  var primaries=sortByRank(g.primary);
  var secondaries=sortByRank(g.secondary.filter(function(e){return !g.primary.find(function(x){return x.name===e.name;});}));
  var pends=sortByRank(g.pending);
  var a=g.primary.filter(function(e){return e.st==='在职';}).length;
  var pt=g.primary.filter(function(e){return e.st==='兼职';}).length;
  var pe=g.pending.length;
  var d0=document.getElementById('detail'+pi);
  var html='<div class="sec-title"><h2>'+pl+'</h2><p class="desc">'+
    '负责人：<b>'+esc(lead?lead.name:'—')+'</b> · '+esc(lead?lead.title:'')+
    ' &nbsp;|&nbsp; 在职 '+a+(pt?' · 兼职 '+pt:'')+(pe?' · 待招 '+pe:'')+'</p></div>';
  html+='<div class="detail-card">';

  // Group primary members by dept
  var priOthers=primaries.filter(function(e){return!lead||e.name!==lead.name;});
  var rdSide=priOthers.filter(function(e){return e.dept==='研发部';});
  var dlSide=priOthers.filter(function(e){return e.dept==='交付部';});
  var otSide=priOthers.filter(function(e){return e.dept!=='研发部'&&e.dept!=='交付部';});
  var sections=[];

  if(rdSide.length)sections.push({l:'研发侧',d:rdSide});
  if(dlSide.length)sections.push({l:'交付侧',d:dlSide});
  if(otSide.length)sections.push({l:'其他',d:otSide});
  sections.forEach(function(s,i){
    if(i>0)html+='<div class="spt"></div>';
    html+='<div class="shdr">'+s.l+'</div><table class="data-table" style="margin-top:0">'+tHead()+'<tbody>';
    s.d.forEach(function(e){var isLead=lead&&e.name===lead.name;html+=tRow(e,true,color,isLead);});
    html+='</tbody></table>';
  });

  // Cross-line
  if(secondaries.length){
    html+='<div class="spt"></div><div class="shdr">跨线协作</div><table class="data-table" style="margin-top:0">'+tHead()+'<tbody>';
    secondaries.forEach(function(e){html+=tRow(e,false,color,false);});
    html+='</tbody></table>';
  }

  // Pending
  if(pends.length){
    html+='<div class="spt"></div><div class="shdr" style="color:#94A3B8">待招 '+pends.length+'</div><table class="data-table" style="margin-top:0">'+tHead()+'<tbody>';
    pends.forEach(function(e){html+=pendRow(e);});
    html+='</tbody></table>';
  }

  html+='</div>';
  d0.innerHTML=html;
});

// === S8 交叉矩阵 ===
(function(){
  var mx='<table class="matrix-table"><thead><tr><th>姓名</th><th>职位</th><th>部门</th>';
  ALL_PLS.forEach(function(pl){mx+='<th style="background:'+PL_COLORS[pl]+';color:#fff;font-size:.72vw">'+pl+'</th>';});
  mx+='</tr></thead><tbody>';
  FUNC_DEPT_ORDER.forEach(function(fd){
    var deptEmps=employees.filter(function(e){return e.dept===fd&&e.name!=='赵健章'&&e.name!=='施驰'&&e.st!=='待入职';}).sort(function(a,b){return rankWeight(a.title)-rankWeight(b.title);});
    if(!deptEmps.length)return;
    deptEmps.forEach(function(e){
      mx+='<tr><td class="cell-name">'+esc(e.name)+(e.st==='兼职'?' <span class="st-tag" style="background:#fef3c7;color:#92400e;font-size:.62vw">兼职</span>':'')+'</td>';
      mx+='<td style="font-size:.78vw;color:var(--muted)">'+esc(e.title)+'</td>';
      mx+='<td style="background:none"><span style="color:'+FUNC_DEPT_COLOR[fd]+';font-weight:500">'+fd+'</span></td>';
      ALL_PLS.forEach(function(pl){
        var isPri=e.pri===pl,isSec=e.sec.indexOf(pl)>=0;
        if(isPri)mx+='<td style="background:'+PL_BG[pl]+'"><span style="color:'+PL_COLORS[pl]+';font-weight:700">主力</span></td>';
        else if(isSec)mx+='<td style="color:var(--muted)">辅助</td>';
        else mx+='<td></td>';
      });
      mx+='</tr>';
    });
  });
  mx+='</tbody></table>';
  document.getElementById('matrixDetail').innerHTML=mx;
})();

// === 渲染组织结构图 ===
document.getElementById('orgChartPL').innerHTML=renderOrgChart();
document.getElementById('orgChartFunc').innerHTML=renderFuncChart();

// === NAV ===
(function(){
  var slides=document.querySelectorAll('.slide'),dotsEl=document.getElementById('dots');
  var prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),slideNum=document.getElementById('slideNum');
  var total=slides.length,current=0;
  for(var i=0;i<total;i++){var dot=document.createElement('span');dot.className='dot'+(i===0?' active':'');dot.setAttribute('data-i',i);dot.onclick=function(){goTo(parseInt(this.getAttribute('data-i')));};dotsEl.appendChild(dot);}
  slideNum.textContent='1/'+total;
  function goTo(idx){if(idx<0||idx>=total)return;slides[current].classList.remove('active');dotsEl.children[current].classList.remove('active');current=idx;slides[current].classList.add('active');dotsEl.children[current].classList.add('active');slideNum.textContent=(current+1)+'/'+total;}
  prevBtn.onclick=function(){goTo(current-1);};nextBtn.onclick=function(){goTo(current+1);};
  document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goTo(current+1);}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goTo(current-1);}if(e.key===' '){e.preventDefault();goTo(current+1);}if(e.key==='Home'){e.preventDefault();goTo(0);}if(e.key==='End'){e.preventDefault();goTo(total-1);}});
  var touchStartX=0;document.addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX;});document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>60){goTo(dx<0?current+1:current-1);}});
})();
})();
</script>
